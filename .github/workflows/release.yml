name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate tag and project version
        shell: pwsh
        run: |
          $version = (mvn -q -DforceStdout -Dstyle.color=never help:evaluate -Dexpression=project.version | Select-Object -Last 1).Trim()
          if ($version -match 'SNAPSHOT$') { throw "Release version must not be a SNAPSHOT: $version" }
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag must be v$version" }
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: Clean verify
        run: mvn -B -ntp clean verify -Dgroups='!e2e'
      - name: Package release
        shell: pwsh
        run: .\scripts\package-release.ps1 -Version "$env:VERSION"
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            --draft `
            --verify-tag `
            --generate-notes `
            --title "clawkit $env:VERSION"
      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" `
            "dist/clawkit-$env:VERSION.jar" `
            "dist/clawkit-$env:VERSION-windows.zip" `
            "dist/SHA256SUMS.txt"
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft=false
