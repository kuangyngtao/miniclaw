services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clawkit
      POSTGRES_PASSWORD: fixture-superuser-only
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
    ports: ["${POSTGRES_PORT:-15432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clawkit"]
      interval: 2s
      timeout: 2s
      retries: 30
  order-api:
    build: ./order-api
    ports: ["127.0.0.1:${ORDER_API_PORT:-18080}:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/clawkit
      DB_USER: clawkit_app
      DB_PASSWORD: fixture-app-only
      DB_POOL_SIZE: "6"
      CONTROL_TOKEN: fixture-control-only
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
  gateway:
    image: nginx:1.27-alpine
    ports: ["${GATEWAY_PORT:-18081}:8080"]
    volumes: ["./gateway.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      order-api:
        condition: service_healthy
  k6:
    image: grafana/k6:0.57.0
    profiles: ["load"]
    volumes: ["./k6:/scripts:ro"]
    environment:
      BASE_URL: http://gateway:8080
    command: ["run", "/scripts/orders.js"]
