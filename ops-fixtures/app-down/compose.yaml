services:
  demo-api:
    image: nginx:1.27-alpine
    restart: "no"
    volumes:
      - ./demo-api.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health | grep -q 'UP'"]
      interval: 1s
      timeout: 1s
      retries: 10
      start_period: 2s
    networks:
      - ops0a

  gateway:
    image: nginx:1.27-alpine
    restart: "no"
    depends_on:
      demo-api:
        condition: service_healthy
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${OPS_HTTP_PORT:-18080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health | grep -q 'UP'"]
      interval: 1s
      timeout: 1s
      retries: 10
      start_period: 2s
    networks:
      - ops0a

networks:
  ops0a:
    driver: bridge
